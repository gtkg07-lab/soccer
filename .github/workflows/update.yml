name: データ更新と公開

on:
  schedule:
    - cron: "*/15 * * * *"   # 15分ごと：試合結果・スタメン・スタッツ・順位表
    - cron: "0 15 * * *"     # 毎日0時（日本時間）：上に加えて全チームの選手一覧と日程の見直し
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: データ取得
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          AF_KEY: ${{ secrets.AF_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            python scripts/fetch.py --rosters
          else
            python scripts/fetch.py
          fi

      - name: 変更があれば保存
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data names
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 変更があったとき（または手動・コード更新のとき）だけ公開し直す
      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
